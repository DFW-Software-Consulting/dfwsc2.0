services:
  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
    # Use migrate instead of push for production for better safety and consistency
    command: sh -lc "npm run db:migrate"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: "no"
    networks:
      - backend

  api:
    container_name: dfwsc-api
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4242}
      DATABASE_URL: ${DATABASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      API_BASE_URL: ${API_BASE_URL}
      ALLOW_ADMIN_SETUP: ${ALLOW_ADMIN_SETUP}
      # SETUP_FLAG_PATH is intentionally not wired here: it defaults to an
      # ephemeral container path with no persistent volume, so it resets on
      # every redeploy. The DB-level `setupConfirmed` guard is the
      # authoritative protection against re-running admin setup; the file
      # flag is only a secondary, non-persistent safeguard.
      USE_CHECKOUT: ${USE_CHECKOUT}
      DEFAULT_PROCESS_FEE_CENTS: ${DEFAULT_PROCESS_FEE_CENTS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "127.0.0.1:4242:4242"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    command: node dist/index.js
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4242/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - backend

  backup:
    image: alpine:3.20
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AWS_S3_BACKUP_BUCKET: ${AWS_S3_BACKUP_BUCKET:-}
    volumes:
      - ./scripts:/scripts:ro
      - postgres_backups:/backups
    command: >
      sh -c "apk add --no-cache bash postgresql-client gzip findutils aws-cli &&
      echo '0 2 * * * /scripts/backup-db.sh >> /proc/1/fd/1 2>> /proc/1/fd/2' > /etc/crontabs/root &&
      crond -f -l 8"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_backups:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
