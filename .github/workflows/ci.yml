name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Backend type-check
        run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: backend

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stripe_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stripe_portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Backend ---
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Run migrations
        run: npm run db:migrate
        working-directory: backend
      - name: Backend tests (coverage)
        run: npm run test:coverage
        working-directory: backend

      # --- Frontend ---
      - name: Install frontend deps
        run: npm ci
        working-directory: front
      - name: Frontend tests
        run: npm test
        working-directory: front

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml build

  # --- Checks mirrored from the local git hooks ---

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Secret scan (secretlint)
        run: npx secretlint "**/*"

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Lint PR commit messages (commitlint)
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  source-guards:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No console/debugger or .only/.skip in changed code
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          src=$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" | grep -E '\.(ts|tsx|js|jsx)$' | grep -vE '\.(test|spec)\.' || true)
          if [ -n "$src" ]; then
            hits=$(git diff "$BASE" "$HEAD" -- $src | grep -E '^\+[^+].*\b(console\.(log|warn|error|info|debug)|debugger)\b' || true)
            if [ -n "$hits" ]; then
              echo "::error::console.log/debugger added in source files:"
              echo "$hits"
              exit 1
            fi
          fi
          tests=$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" | grep -E '\.(test|spec)\.(ts|tsx|js|jsx)$' || true)
          if [ -n "$tests" ]; then
            hits=$(git diff "$BASE" "$HEAD" -- $tests | grep -E '^\+[^+].*(it|test|describe)\.(only|skip)\(' || true)
            if [ -n "$hits" ]; then
              echo "::error::.only/.skip added in test files:"
              echo "$hits"
              exit 1
            fi
          fi
          echo "Source guards passed."

  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent docs in sync with CLAUDE.md
        run: |
          set -eu
          fail=0
          for f in AGENTS.md Qwen.md Gemini.md; do
            if ! diff -q CLAUDE.md "$f" >/dev/null 2>&1; then
              echo "::error::$f is out of sync with CLAUDE.md"
              diff CLAUDE.md "$f" || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Regenerate the mirrors from CLAUDE.md (see .claude/sync-docs.sh)."
            exit 1
          fi
          echo "Agent docs in sync."
