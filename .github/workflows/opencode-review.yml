# OpenCode AI pull-request review (advisory only; never blocks CI).
#
# Secret (Settings > Secrets and variables > Actions > Secrets):
#   OPENCODE_API_KEY               OpenCode Go API key (the opencode-go provider reads it
#                                  from the OPENCODE_API_KEY env var per models.dev).
# Variable (optional, Settings > Secrets and variables > Actions > Variables):
#   OPENCODE_REVIEW_MODEL          model to use, default opencode-go/kimi-k3.1-pro
#
# Triggers: non-draft same-repo PRs get an automatic review; a /oc or /opencode comment from
# an OWNER/MEMBER/COLLABORATOR on a PR runs OpenCode with the comment text as the instruction.
# Without the secret the job logs a warning and succeeds. The model is read-only: edit and
# webfetch are denied and bash is limited to read-only git/gh commands (see OPENCODE_CONFIG_CONTENT).
# Every permission is an explicit allow/deny because `opencode github run` never answers "ask" prompts.
#
# OpenCode is installed from the pinned GitHub release (not the composite action / curl installer,
# which edits shell rc files) and `opencode github run` is supervised by a watchdog: when the
# OpenCode Go quota is exhausted the CLI retries forever, so the first quota/429 error in its output
# stops the run. There is no fallback model; a failed review is skipped with one PR comment. The
# action also posts its own raw error comment; the cleanup step deletes only github-actions[bot]
# issue comments created during this run that link to this run.
name: OpenCode Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# One run per PR; a newer run supersedes the old one. Comments that are not /oc commands get a
# unique group (run_id) so ordinary chatter never cancels an in-flight review.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ (github.event_name == 'pull_request' || contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) && 'active' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: OpenCode review
    runs-on: ubuntu-latest
    # Must stay well above the run step (12 min) so the cleanup and notify steps always run.
    timeout-minutes: 25
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !contains(fromJSON('["dependabot[bot]","renovate[bot]","github-actions[bot]"]'), github.event.pull_request.user.login)
      ) || (
        (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
          github.event_name == 'pull_request_review_comment'
        ) &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      OPENCODE_VERSION: 1.19.5
      # CI-only, review-only config. Highest-precedence runtime override; never touches repo files.
      OPENCODE_CONFIG_CONTENT: |
        {
          "$schema": "https://opencode.ai/config.json",
          "autoupdate": false,
          "permission": {
            "edit": "deny",
            "webfetch": "deny",
            "websearch": "deny",
            "external_directory": "deny",
            "doom_loop": "deny",
            "question": "deny",
            "read": {
              "*": "allow",
              "*.env": "deny",
              "*.env.*": "deny",
              "*.env.example": "allow"
            },
            "bash": {
              "*": "deny",
              "git diff*": "allow",
              "git log*": "allow",
              "git show*": "allow",
              "git status*": "allow",
              "gh pr diff*": "allow",
              "gh pr view*": "allow"
            }
          }
        }
      REVIEW_PROMPT: |
        Review this pull request's diff for correctness bugs, security issues, regressions,
        data-loss risks, and missing or incorrect tests. Follow the conventions in the repo's
        AGENTS.md. Skip formatting and style nits that a linter would catch. Group findings by
        severity (blocking / should-fix / nit) with file:line references. If you find nothing
        significant, reply with a short LGTM. Never modify files or push commits.
    steps:
      - name: Check OPENCODE_API_KEY
        id: key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::OpenCode review skipped: OPENCODE_API_KEY not configured"
            echo "OpenCode review skipped: OPENCODE_API_KEY not configured" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.key.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Cache OpenCode
        id: cache
        if: steps.key.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opencode-1.19.5
          key: opencode-1.19.5-${{ runner.os }}-${{ runner.arch }}

      - name: Install OpenCode (pinned release)
        if: steps.key.outputs.configured == 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          [ "$(uname -s)" = "Linux" ] && [ "$(uname -m)" = "x86_64" ] || { echo "::error::Unsupported runner platform $(uname -s)/$(uname -m)"; exit 1; }
          # sha256 of the v${OPENCODE_VERSION} release assets (GitHub release asset digests).
          if grep -qwi avx2 /proc/cpuinfo; then
            asset=opencode-linux-x64.tar.gz
            sha=588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a
          else
            asset=opencode-linux-x64-baseline.tar.gz
            sha=17c200fd4b2289954cc01552559f9b6d03ec157b2ddfb5eb54144f491656333d
          fi
          dir="$RUNNER_TEMP/opencode-$OPENCODE_VERSION"
          dl="$RUNNER_TEMP/opencode-download"
          rm -rf "$dir" "$dl"; mkdir -p "$dir" "$dl"
          gh release download "v$OPENCODE_VERSION" -R anomalyco/opencode -p "$asset" -D "$dl"
          echo "$sha  $dl/$asset" | sha256sum -c -
          tar -xzf "$dl/$asset" -C "$dir"
          rm -rf "$dl"

      - name: Add OpenCode to PATH
        if: steps.key.outputs.configured == 'true'
        run: |
          set -eu
          echo "$RUNNER_TEMP/opencode-$OPENCODE_VERSION" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/opencode-$OPENCODE_VERSION/opencode" --version

      - name: Snapshot bot comments
        if: steps.key.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | .id' > "$RUNNER_TEMP/bot-comments.txt" || : > "$RUNNER_TEMP/bot-comments.txt"

      # Replicates the composite action's "Run opencode" step (github/action.yml @ v1.19.5) with a
      # watchdog. The step always exits 0; the outcome is in outputs.reason (ok|quota|error|timeout).
      - name: OpenCode review
        id: run
        if: steps.key.outputs.configured == 'true'
        continue-on-error: true
        timeout-minutes: 12
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode-go/kimi-k3.1-pro' }}
          # Empty for comment events so the comment text is the instruction.
          PROMPT: ${{ github.event_name == 'pull_request' && env.REVIEW_PROMPT || '' }}
          USE_GITHUB_TOKEN: "true"
          AGENT: ""
          MENTIONS: ""
          VARIANT: ""
          OIDC_BASE_URL: ""
          WATCHDOG_SECONDS: "600"
        run: |
          log="$RUNNER_TEMP/opencode.log"
          : > "$log"
          setsid opencode github run > "$log" 2>&1 &
          pid=$!
          tail -n +1 -F "$log" 2>/dev/null &
          tailpid=$!
          pattern='GoUsageLimitError|statusCode: 429|AI_RetryError'
          reason=""
          start=$(date +%s)
          stop_run() { kill -TERM -- "-$pid" 2>/dev/null || true; sleep 2; kill -KILL -- "-$pid" 2>/dev/null || true; }
          trap 'stop_run; kill "$tailpid" 2>/dev/null || true' TERM INT
          while :; do
            if grep -Eq "$pattern" "$log"; then
              reason=quota
              sleep 2   # let the error body and headers finish logging
              stop_run
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" && rc=0 || rc=$?
              if grep -Eq "$pattern" "$log"; then reason=quota
              elif [ "$rc" -eq 0 ]; then reason=ok
              else reason=error; fi
              break
            fi
            if [ $(( $(date +%s) - start )) -ge "$WATCHDOG_SECONDS" ]; then
              reason=timeout
              stop_run
              break
            fi
            sleep 3
          done
          sleep 1
          kill "$tailpid" 2>/dev/null || true
          limit="" ; reset=""
          if [ "$reason" = "quota" ]; then
            limit=$(grep -oE '"limitName" ?: ?"[A-Za-z0-9_-]+"' "$log" | head -n1 | sed -E 's/.*"([A-Za-z0-9_-]+)"$/\1/' || true)
            ra=$(grep -ioE 'retry-after"? ?[:=] ?"?[0-9]+' "$log" | head -n1 | grep -oE '[0-9]+$' || true)
            if [ -n "$ra" ]; then reset=$(date -u -d "@$(( $(date +%s) + ra ))" '+%Y-%m-%d %H:%M UTC' 2>/dev/null || true); fi
          fi
          {
            echo "reason=$reason"
            echo "limit=$limit"
            echo "reset=$reset"
          } >> "$GITHUB_OUTPUT"
          echo "OpenCode run finished: reason=$reason limit=$limit reset=$reset"
          exit 0

      - name: Remove raw error comments
        if: steps.key.outputs.configured == 'true' && steps.run.outputs.reason != 'ok'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only github-actions[bot] issue comments new since the snapshot AND linking to this run.
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("/actions/runs/" + env.GITHUB_RUN_ID)) | .id' > "$RUNNER_TEMP/bot-now.txt" || exit 0
          grep -vxFf "$RUNNER_TEMP/bot-comments.txt" "$RUNNER_TEMP/bot-now.txt" | while read -r id; do
            case "$id" in ''|*[!0-9]*) continue ;; esac
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" || true
          done || true

      - name: Report skipped review
        if: steps.key.outputs.configured == 'true' && steps.run.outputs.reason != 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ steps.run.outputs.reason }}
          LIMIT: ${{ steps.run.outputs.limit }}
          RESET: ${{ steps.run.outputs.reset }}
        run: |
          case "$REASON" in
            quota)
              if [ -n "$LIMIT" ]; then what="OpenCode Go $LIMIT usage limit reached"; else what="OpenCode Go usage limit reached"; fi
              [ -n "$RESET" ] && what="$what (resets ~$RESET)"
              ;;
            error) what="OpenCode errored" ;;
            *) what="OpenCode timed out" ;;
          esac
          echo "::warning::OpenCode review skipped: $what"
          echo "OpenCode review skipped: $what. [Run logs]($RUN_URL)" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ OpenCode review skipped — $what. CI is unaffected. [Run logs]($RUN_URL)" \
            || echo "::warning::Could not post skip comment"
