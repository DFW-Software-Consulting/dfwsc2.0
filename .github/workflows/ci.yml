name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            front/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix front
      - run: npm run lint
      # Non-blocking dependency vulnerability scan (tighten later by dropping `|| true`
      # once existing findings are triaged).
      - name: Backend dependency audit
        run: npm audit --prefix backend --audit-level=high || true
      - name: Frontend dependency audit
        run: npm audit --prefix front --audit-level=high || true

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            front/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Backend type-check
        run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: backend
      - name: Install frontend deps
        run: npm ci
        working-directory: front
      - name: Frontend build check
        run: npm run build
        working-directory: front

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stripe_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stripe_portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stripe_portal_test
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      FRONTEND_ORIGIN: http://localhost:5173
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_USER: ci
      SMTP_PASS: ci
      JWT_SECRET: ci_jwt_secret_min_32_chars_xxxxxxxxx
      NODE_ENV: test
      SMTP_FROM: noreply@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            front/package-lock.json

      # --- Backend ---
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Run migrations
        run: npm run db:migrate
        working-directory: backend
      - name: Backend tests (coverage-enforced)
        run: npm run test:coverage
        working-directory: backend

      # --- Frontend ---
      - name: Install frontend deps
        run: npm ci
        working-directory: front
      - name: Frontend tests
        run: npm test -- --run
        working-directory: front

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t dfwsc-api:ci -f backend/Dockerfile backend
      - name: Build frontend Docker image
        run: docker build -t dfwsc-web:ci -f front/Dockerfile front

  # --- Checks mirrored from the local git hooks ---

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Secret scan (secretlint)
        run: npx secretlint "**/*"

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Lint PR commit messages (commitlint)
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  source-guards:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No console/debugger or .only/.skip in changed code
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          src=$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" | grep -E '\.(ts|tsx|js|jsx)$' | grep -vE '\.(test|spec)\.' || true)
          if [ -n "$src" ]; then
            hits=$(git diff "$BASE" "$HEAD" -- $src | grep -E '^\+[^+].*\b(console\.(log|warn|error|info|debug)|debugger)\b' || true)
            if [ -n "$hits" ]; then
              echo "::error::console.log/debugger added in source files:"
              echo "$hits"
              exit 1
            fi
          fi
          tests=$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" | grep -E '\.(test|spec)\.(ts|tsx|js|jsx)$' || true)
          if [ -n "$tests" ]; then
            hits=$(git diff "$BASE" "$HEAD" -- $tests | grep -E '^\+[^+].*(it|test|describe)\.(only|skip)\(' || true)
            if [ -n "$hits" ]; then
              echo "::error::.only/.skip added in test files:"
              echo "$hits"
              exit 1
            fi
          fi
          echo "Source guards passed."

  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agent docs in sync with CLAUDE.md
        run: |
          set -eu
          fail=0
          for f in AGENTS.md Qwen.md Gemini.md; do
            if ! diff -q CLAUDE.md "$f" >/dev/null 2>&1; then
              echo "::error::$f is out of sync with CLAUDE.md"
              diff CLAUDE.md "$f" || true
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Regenerate the mirrors from CLAUDE.md (see .claude/sync-docs.sh)."
            exit 1
          fi
          echo "Agent docs in sync."

  # Fallow codebase-intelligence gate: fails only on NEW dead code / circular deps /
  # unresolved imports introduced beyond the committed baselines. Existing debt is
  # baselined (see fallow-baselines/), so touching a file with legacy findings does
  # not fail CI. Regenerate a baseline after cleaning debt:
  #   (cd backend && npx fallow@2.104.0 dead-code --save-baseline ../fallow-baselines/backend-dead-code.json --quiet)
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fallow dead-code gate (backend)
        working-directory: backend
        run: npx --yes fallow@2.104.0 dead-code --baseline ../fallow-baselines/backend-dead-code.json --fail-on-issues --quiet
      - name: Fallow dead-code gate (frontend)
        working-directory: front
        run: npx --yes fallow@2.104.0 dead-code --baseline ../fallow-baselines/front-dead-code.json --fail-on-issues --quiet
