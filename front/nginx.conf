resolver 127.0.0.11 valid=30s;

# Cache policy by final status and URI (after try_files / index rewrites and error_page
# internal redirects). An empty value makes nginx omit the header. Done as a map +
# server-level add_header, rather than add_header inside locations, because nginx drops
# every server-level add_header (the security headers) in a location that sets its own.
# Regexes are tried in order, first match wins.
#
# A hashed asset is immutable only when it was actually served. Any other status for an
# /assets/ URL (404 during a deploy rollover, 5xx) is no-store: a browser or CDN that
# keeps a failed asset response breaks the page until the entry expires. Cloudflare
# applies its Browser Cache TTL to cacheable file extensions, so "no-cache" is not enough.
map "$status:$uri" $static_cache_control {
    default "";
    # Proxied API responses carry their own Cache-Control (add_header would append a second).
    "~^\d+:/api/" "";
    "~^(200|206|304):/assets/" "public, max-age=31536000, immutable";
    "~^\d+:/assets/" "no-store";
    # The not-found page (and any other 404) must never be kept either.
    "~^404:" "no-store";
    "~\.html$" "no-cache";
    # Unhashed and must agree with ThemeContext.readTheme(), so always revalidate.
    "~^\d+:/theme-init\.js$" "no-cache";
}

# Pages that must never be indexed: the SPA shell served for portal routes and the 404
# page. Sent as a header (also a meta tag in the HTML) from the server-level add_header
# below, for the same reason as the cache map above. An empty value omits the header.
map $uri $robots_tag {
    default "";
    /spa.html "noindex, nofollow";
    /404.html "noindex, nofollow";
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects use a relative Location: behind Cloudflare and Traefik nginx only sees
    # plain http on its own port, so an absolute one would point at the wrong origin.
    absolute_redirect off;
    charset utf-8;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # __ANALYTICS_ORIGIN__ is replaced by the frontend Docker build with the
    # origin parsed from VITE_ANALYTICS_SRC (or an empty string when disabled).
    # This permits the configured script and its Plausible-compatible /api/event
    # endpoint without allowing arbitrary third-party scripts or connections.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __ANALYTICS_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.dfwsc.com __ANALYTICS_ORIGIN__; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    add_header X-Robots-Tag $robots_tag always;

    # "always" so error pages get it too (see the map above for the policy).
    add_header Cache-Control $static_cache_control always;

    client_max_body_size 10m;

    # Proxy API requests to backend
    location /api/ {
        set $backend_upstream http://dfwsc-api:4242;
        # No URI on proxy_pass: with a variable upstream, a URI here (e.g.
        # ".../api/") REPLACES the request path instead of appending to it,
        # so "/api/v1/health" would be sent to the backend as just "/api/"
        # (404). Passing the upstream alone forwards the full original path,
        # and the backend already serves its routes under /api/v1.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 10s;
    }

    # Hashed build output. A missing file must 404, not fall back to index.html,
    # or a stale tab would receive HTML for a JS chunk after a deploy. The 404 is a tiny
    # plain-text body (not the HTML not-found page) and is sent no-store by the map above.
    location /assets/ {
        try_files $uri @asset_missing;
    }

    location @asset_missing {
        types { }
        default_type text/plain;
        return 404 "Not found\n";
    }

    # The marketing pages are prerendered at build time (scripts/prerender.mjs) as
    # index.html, pricing.html, team.html and privacy.html, and served at clean URLs.
    # Keep these paths in sync with PUBLIC_ROUTES in src/seo/meta.js.
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(pricing|team|privacy)$ {
        try_files /$1.html =404;
    }

    # One URL per page: a trailing slash redirects to the canonical path.
    location ~ ^/(pricing|team|privacy)/$ {
        return 301 /$1$is_args$args;
    }

    # The developer integration guide moved to a Nextcloud Collective (login required).
    # No add_header here: the server-level security headers must still apply.
    location ~ ^/docs(/|\.html)?$ {
        return 301 https://cloud.dfwsc.com/apps/collectives/Developer-Integration-Guide-4;
    }

    # Portal routes are client-rendered: serve the unrendered shell, marked noindex.
    # Keep in sync with PRIVATE_ROUTES in src/seo/meta.js and the routes in src/routes.js.
    location ~ ^/(admin|demos|onboard|payment-success|payment-cancel|onboarding-success|regenerate-key|request-key-regeneration)/?$ {
        try_files /spa.html =404;
    }

    # The prerendered files are only reachable through the clean URLs above (so / has one
    # URL, not also /index.html).
    location ~ ^/(index|pricing|team|privacy|spa|404)\.html$ {
        internal;
    }

    # Real files only (robots.txt, sitemap.xml, llms.txt, icons, images). Anything else is
    # a genuine 404 with the not-found page, not a 200 that serves the app.
    error_page 404 /404.html;

    location / {
        try_files $uri =404;
    }

    # Optional: don't send logs for favicon.ico requests
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Optional: don't send logs for robots.txt requests
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Optional: enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}
